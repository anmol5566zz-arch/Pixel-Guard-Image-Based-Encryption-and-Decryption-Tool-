<!DOCTYPE html>
<html>
<head>
    <!-- The title appears in the browser tab and identifies the purpose of this page. -->
    <title>Student Image Encryptor</title>
    <style>
        /* Center the application and provide a light background around it. */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }

        /* Keep the controls, status message, and canvas together in one readable panel. */
        .main-box {
            background-color: white;
            border: 2px solid #ccc;
            padding: 20px;
            width: 600px;
            margin: 0 auto;
            border-radius: 10px;
        }

          /* The canvas displays the original or transformed image. Its maximum width keeps
              large images from overflowing the panel while preserving their actual pixels. */
        canvas {
            border: 1px solid black;
            max-width: 100%;
            margin-top: 15px;
            background-color: #eee;
        }

        /* Give form controls a consistent size and spacing. */
        input, button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }

        /* Reserve space for status text so the layout does not jump as messages change. */
        #message-box {
            color: red;
            font-weight: bold;
            margin-top: 10px;
            height: 20px;
        }
    </style>
</head>
<body>

    <!-- Main application interface. JavaScript finds these elements by their IDs below. -->
    <div class="main-box">
        <h2>Simple Image Encryptor</h2>
        
        <p>1. Select an image:</p>
        <input type="file" id="file-input" accept="image/*">
        
        <p>2. Enter a password:</p>
        <input type="text" id="password" placeholder="My secret password">
        
        <br><br>
        <button id="btn-process">Encrypt / Decrypt</button>
        <button id="btn-download" disabled>Save Image</button>

           <!-- Status and validation messages are shown here instead of using alert(), so they
               remain part of the page and do not interrupt the user's workflow. -->
        <div id="message-box"></div>

           <!-- Image pixels are read from and written back to this canvas. -->
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // Cache the canvas, its drawing context, and an Image object for reuse. The 2D context
        // provides the methods needed to draw the image and inspect or update its pixels.
        let myCanvas = document.getElementById('canvas');
        let ctx = myCanvas.getContext('2d');
        let imgElement = new Image();
        
        // Handle file selection. The selected image is loaded into memory before it is drawn.
        document.getElementById('file-input').onchange = function(e) {
            // A file input can technically have no file selected, for example after canceling
            // the picker, so stop before trying to read an undefined value.
            let file = e.target.files[0];
            if (!file) return;

            // FileReader converts the local file into a data URL that an Image element can use.
            let reader = new FileReader();
            reader.onload = function(event) {
                // Wait until the browser has decoded the image before reading its dimensions
                // or drawing it. This callback runs after imgElement.src is assigned below.
                imgElement.onload = function() {
                    // Match the canvas's internal pixel dimensions to the source image. Setting
                    // width and height also clears any pixels left by a previously loaded image.
                    myCanvas.width = imgElement.width;
                    myCanvas.height = imgElement.height;

                    // Copy the decoded image onto the canvas so it can be processed pixel by pixel.
                    ctx.drawImage(imgElement, 0, 0);

                    // A download is only useful after an image has been loaded onto the canvas.
                    document.getElementById('btn-download').disabled = false;
                    document.getElementById('message-box').innerText = "Image loaded!";
                }

                // Start image decoding with the data URL produced by FileReader.
                imgElement.src = event.target.result;
            }

            // Begin reading the local image asynchronously as a data URL.
            reader.readAsDataURL(file);
        };

        // Convert the password into a repeatable starting value. The same password always
        // produces the same seed, which is required for decrypting with the same operation.
        function getSeed(password) {
            let seed = 0;
            for (let i = 0; i < password.length; i++) {
                // Add each character's Unicode code to incorporate the whole password.
                seed += password.charCodeAt(i);
            }
            return seed;
        }

        // Encrypt or decrypt the currently displayed image when the process button is clicked.
        document.getElementById('btn-process').onclick = function() {
            let pwd = document.getElementById('password').value;

            // An empty password cannot generate a meaningful key, so reject it before any
            // canvas work begins.
            if (pwd === "") {
                document.getElementById('message-box').innerText = "Please enter a password!";
                return;
            }

            document.getElementById('message-box').innerText = "Processing...";

            // Give the browser a moment to paint the status message before the synchronous
            // pixel loop begins. This makes the interface visibly acknowledge the request.
            setTimeout(function() {
                // getImageData returns a flat array containing four values per pixel in the
                // order Red, Green, Blue, and Alpha (transparency).
                let imgData = ctx.getImageData(0, 0, myCanvas.width, myCanvas.height);
                let pixels = imgData.data;
                
                // Start the deterministic pseudo-random sequence from the password-derived key.
                let seed = getSeed(pwd);

                // Advance four positions at a time because each pixel occupies four array
                // entries: red at i, green at i + 1, blue at i + 2, and alpha at i + 3.
                for (let i = 0; i < pixels.length; i += 4) {
                    // Generate the next deterministic, random-looking value with a basic Linear
                    // Congruential Generator (LCG). It is not suitable for real cryptography,
                    // but it gives the same byte sequence when the same password is used again.
                    seed = (seed * 1103515245 + 12345) % 2147483648;
                    
                    // Extract one byte (0-255) from the generated seed for this pixel.
                    let randomVal = (seed >> 16) & 0xFF;

                    // XOR the color channels with the same byte. XOR is reversible: applying
                    // the identical operation a second time restores the original channel values.
                    pixels[i]     = pixels[i]     ^ randomVal; // Red
                    pixels[i + 1] = pixels[i + 1] ^ randomVal; // Green
                    pixels[i + 2] = pixels[i + 2] ^ randomVal; // Blue
                    // Leave pixels[i + 3] unchanged so transparent and opaque areas retain their
                    // original visibility.
                }

                // Commit the modified pixel array so the transformed image becomes visible.
                ctx.putImageData(imgData, 0, 0);
                document.getElementById('message-box').innerText = "Done! You can save it now.";
            }, 100);
        };

        // Export the current canvas as a PNG when the save button is clicked.
        document.getElementById('btn-download').onclick = function() {
            // Create a temporary link because browsers download a data URL when it is clicked
            // with a download filename instead of navigating to it.
            let link = document.createElement('a');
            link.download = 'secret_image.png'; // Always save as PNG!

            // Convert the canvas pixels into a PNG data URL and use it as the download source.
            link.href = myCanvas.toDataURL('image/png');
            link.click();
        };
    </script>

</body>
</html>
